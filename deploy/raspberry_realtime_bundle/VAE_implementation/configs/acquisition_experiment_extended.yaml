experiment:
  name: "fm_extended_v1"
  output_root: "data/raw/extended_acquisition"
  sensor_id: "ane_pi0"
  location_labels: ["bogota_norte", "bogota_centro", "funza"]
  scenario_labels: ["urban_dense", "urban_mixed", "periurban", "indoor", "outdoor"]
  repeats_per_profile: 3
  capture_duration_s: 180
  notes: "Extended acquisition matrix for richer VAE training."

rf:
  center_freq_hz: [88100000, 92100000, 96100000, 100100000, 104100000, 107100000]
  sample_rate_hz: [1000000, 2000000, 5000000]
  rbw_hz: [5000, 10000, 25000, 50000]
  window: ["hann", "blackman", "rectangular"]
  overlap: [0.25, 0.5, 0.75]
  lna_gain: [0, 8, 16, 24]
  vga_gain: [10, 20, 30, 40, 50]
  antenna_amp: [false, true]
  antenna_port: [0]
  decimation: [1, 2, 4]

execution:
  shuffle_profiles: true
  random_seed: 2026
  daily_time_blocks:
    - "06:00-08:00"
    - "10:00-12:00"
    - "14:00-16:00"
    - "18:00-20:00"
    - "22:00-23:30"
